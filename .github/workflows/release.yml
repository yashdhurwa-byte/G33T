name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Get version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

          VERSION_LOWER=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')
          if [[ "$VERSION_LOWER" == *"-preview"* ]] || [[ "$VERSION_LOWER" == *"-beta"* ]] || [[ "$VERSION_LOWER" == *"-rc"* ]] || [[ "$VERSION_LOWER" == *"-alpha"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Detected pre-release version: $VERSION"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Detected stable version: $VERSION"
          fi

  build-android:
    name: Build Android arm64-v8a Release
    runs-on: ubuntu-latest
    needs: get-version
    env:
      MORNYE_RUST_ANDROID_ABIS: "arm64-v8a"
      CARGO_TERM_COLOR: always

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/30.0.16248370
          key: ndk-30.0.16248370

      - name: Install Android SDK & NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;30.0.16248370" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: |
          rustup show
          rustup target add aarch64-linux-android

      - name: Cache Rust dependencies & build targets
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust_backend/target/
          key: ${{ runner.os }}-rust-arm64-${{ hashFiles('rust_backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-arm64-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-arm64-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-arm64-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build release arm64-v8a APK
        run: |
          export MORNYE_RUST_ANDROID_ABIS="arm64-v8a"
          bash scripts/build_android.sh --target lib/main.dart
          ls -la build/app/outputs/flutter-apk/

      - name: Sign and verify arm64-v8a release APK
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apk_dir="build/app/outputs/flutter-apk"
          target_apk="$apk_dir/Mornye-${VERSION}-arm64.apk"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            umask 077
            signing_dir="$(mktemp -d "$RUNNER_TEMP/mornye-signing.XXXXXX")"
            trap 'rm -rf "$signing_dir"' EXIT
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.jks"
            apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
            export KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"

            "$apksigner" sign \
              --ks "$signing_dir/release.jks" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled true \
              --out "$target_apk" "$apk_dir/app-arm64-v8a-release.apk"
          else
            echo "Signing keystore not provided; packaging unsigned release artifact"
            cp "$apk_dir/app-arm64-v8a-release.apk" "$target_apk"
          fi

          (cd "$apk_dir" && sha256sum Mornye-*.apk > SHA256SUMS.txt)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-apk
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/Mornye-*.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt

  create-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [get-version, build-android]
    if: success()
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-arm64-apk
          path: ./release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-version.outputs.version }}
          name: Release ${{ needs.get-version.outputs.version }}
          prerelease: ${{ needs.get-version.outputs.is_prerelease == 'true' }}
          files: |
            ./release/Mornye-*.apk
            ./release/SHA256SUMS.txt
          generate_release_notes: true
