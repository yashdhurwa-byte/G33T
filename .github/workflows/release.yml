name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Get version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            VERSION="v1.0.0-build.${SHORT_SHA}"
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Detected pre-release version: $VERSION"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Detected stable version: $VERSION"
          fi

  build-android:
    name: Build GEET Android Release
    runs-on: ubuntu-latest
    needs: get-version
    env:
      MORNYE_RUST_ANDROID_ABIS: "arm64-v8a"
      CARGO_TERM_COLOR: always

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/30.0.16248370
          key: ndk-30.0.16248370

      - name: Install Android SDK & NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;30.0.16248370" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;4.1.2"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev ffmpeg
          echo "MORNYE_TEST_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: |
          rustup show
          rustup target add aarch64-linux-android

      - name: Cache Rust dependencies & build targets
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust_backend/target/
          key: ${{ runner.os }}-rust-arm64-${{ hashFiles('rust_backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-arm64-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-arm64-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-arm64-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      - name: Run verification checks
        run: |
          cd rust_backend && cargo check --workspace && cd ..
          flutter analyze
          flutter test

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: |
          export MORNYE_RUST_ANDROID_ABIS="arm64-v8a"
          flutter build apk --release --target-platform android-arm64
          ls -la build/app/outputs/flutter-apk/

      - name: Package and checksum GEET release APK
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          set -euo pipefail
          apk_dir="build/app/outputs/flutter-apk"
          target_apk="$apk_dir/GEET-${VERSION}-arm64.apk"

          if [ -f "$apk_dir/app-release.apk" ]; then
            cp "$apk_dir/app-release.apk" "$target_apk"
          elif [ -f "$apk_dir/app-arm64-v8a-release.apk" ]; then
            cp "$apk_dir/app-arm64-v8a-release.apk" "$target_apk"
          fi

          (cd "$apk_dir" && sha256sum GEET-*.apk > SHA256SUMS.txt)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: geet-android-arm64-apk
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/GEET-*.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt

  create-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [get-version, build-android]
    if: success()
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download GEET Android APK
        uses: actions/download-artifact@v4
        with:
          name: geet-android-arm64-apk
          path: ./release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-version.outputs.version }}
          name: GEET ${{ needs.get-version.outputs.version }}
          prerelease: ${{ needs.get-version.outputs.is_prerelease == 'true' }}
          files: |
            ./release/GEET-*.apk
            ./release/SHA256SUMS.txt
          generate_release_notes: true
